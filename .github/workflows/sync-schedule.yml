name: Sync Schedule

on:
  schedule:
    - cron: '0 10 * * *' # 2am PST (UTC 10:00)
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    name: Fetch and Update GTFS Schedule
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch and Parse GTFS
        env:
          TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}
        run: pnpm exec tsx scripts/parse-gtfs.ts > static-schedule.json

      - name: Validate Schedule
        run: pnpm --filter @transit/scripts run validate ../static-schedule.json

      - name: Generate v2 Schedule and Metadata
        run: |
          jq .m static-schedule.json > meta.json
          pnpm exec tsx -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { toV2Schedule } from "./scripts/parse-gtfs.ts";
            const s1 = JSON.parse(readFileSync("static-schedule.json", "utf8"));
            const s2 = toV2Schedule(s1);
            writeFileSync("static-schedule-v2.json", JSON.stringify(s2));
            writeFileSync("meta-v2.json", JSON.stringify(s2.m));
          '

      - name: Validate v2 Schedule
        run: pnpm --filter @transit/scripts run validate ../static-schedule-v2.json

      - name: Upload Schedule Data to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler kv key put schedule:data --path=./static-schedule.json --namespace-id=${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }} --remote
          npx -y wrangler kv key put schedule:v2:data --path=./static-schedule-v2.json --namespace-id=${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }} --remote

      - name: Upload Schedule Meta to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler kv key put schedule:meta --path=./meta.json --namespace-id=${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }} --remote
          npx -y wrangler kv key put schedule:v2:meta --path=./meta-v2.json --namespace-id=${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }} --remote
