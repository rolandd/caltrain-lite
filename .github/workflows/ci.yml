name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format compliance (pnpm run format)
        run: |
          pnpm run format
          git diff --exit-code

      - name: Run linter (pnpm run lint)
        run: pnpm run lint

      - name: Run type checks (pnpm run check)
        run: pnpm run check

      - name: Run tests (pnpm run test)
        run: pnpm run test
