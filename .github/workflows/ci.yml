name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check format compliance (npm run format)
        run: |
          npm run format
          git diff --exit-code

      - name: Run linter (npm run lint)
        run: npm run lint

      - name: Run type checks (npm run check)
        run: npm run check

      - name: Run tests (npm run test)
        run: npm run test
