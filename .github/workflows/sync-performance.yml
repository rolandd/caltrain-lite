name: Sync On-Time Performance

on:
  schedule:
    - cron: '0 11 * * *' # 3am PST (UTC 11:00)
  workflow_dispatch:

jobs:
  process-performance:
    runs-on: ubuntu-latest
    name: Process Historical Telemetry & Update Performance Profile
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Zstandard (zstd) is installed
        run: command -v zstd >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zstd)

      - name: Generate Wrangler Config from Secrets
        env:
          KV_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$KV_ID" ]; then
            echo "::error::CLOUDFLARE_KV_NAMESPACE_ID secret is missing or empty in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$D1_ID" ]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is missing or empty in GitHub Repository Secrets."
            exit 1
          fi
          mkdir -p worker
          cat <<EOF > worker/wrangler.toml
          name = "transit-worker"
          main = "src/index.ts"
          compatibility_date = "2024-04-01"
          compatibility_flags = ["nodejs_compat"]

          kv_namespaces = [
            { binding = "TRANSIT_DATA", id = "$KV_ID" }
          ]

          [[d1_databases]]
          binding = "TRANSIT_DB"
          database_name = "transit-d1"
          database_id = "$D1_ID"
          EOF

      - name: Calculate Dynamic D1 Export Cutoff
        id: d1_cutoff
        run: |
          SINCE_TIMESTAMP=$(npx tsx -e '
            import { getLatestArchivedTimestamp } from "./scripts/process-performance.ts";
            console.log(getLatestArchivedTimestamp("data/history"));
          ')
          echo "since_timestamp=${SINCE_TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "Exporting D1 records since epoch timestamp ${SINCE_TIMESTAMP}"

      - name: Export Unarchived D1 Telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler d1 execute transit-d1 --remote --config=worker/wrangler.toml --command="SELECT id, timestamp, data FROM train_locations WHERE timestamp >= ${{ steps.d1_cutoff.outputs.since_timestamp }} ORDER BY timestamp ASC;" --json > d1-snapshots.json || (cat d1-snapshots.json && exit 1)

      - name: Process Monotonic Performance Profile (Git History + Fresh D1)
        run: |
          npx tsx -e '
            import { readFileSync, writeFileSync } from "fs";
            import { processTrainPerformance, loadArchivedSnapshots, mergeSnapshots } from "./scripts/process-performance.ts";

            async function main() {
              let schedule;
              try {
                console.log("Fetching live schedule from https://transit.rolandd.dev/api/schedule...");
                const res = await fetch("https://transit.rolandd.dev/api/schedule");
                if (res.ok) schedule = await res.json();
              } catch (err) {
                console.warn("Failed to fetch production schedule, using local fixture fallback:", err);
              }

              if (!schedule) {
                const { parseGtfsZip } = await import("./scripts/parse-gtfs.ts");
                schedule = await parseGtfsZip(readFileSync("scripts/fixtures/caltrain-gtfs.zip"));
              }

              const raw = JSON.parse(readFileSync("d1-snapshots.json", "utf8"));
              const recentSnapshots = raw[0]?.results || [];
              writeFileSync("d1-clean.json", JSON.stringify(recentSnapshots));

              const archivedSnapshots = loadArchivedSnapshots("data/history", 90);
              const combined = mergeSnapshots(archivedSnapshots, recentSnapshots);
              const profile = processTrainPerformance(combined, 90, schedule);
              writeFileSync("performance-data.json", JSON.stringify(profile));
            }

            main();
          '

      - name: Upload Performance Profile to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler kv key put performance:data --path=./performance-data.json --binding=TRANSIT_DATA --config=worker/wrangler.toml --remote

      - name: Self-Healing Daily Archival to Git (Zstandard .json.zst)
        run: |
          npx tsx -e '
            import { readFileSync } from "fs";
            import { archiveCompletedDays } from "./scripts/process-performance.ts";
            const snapshots = JSON.parse(readFileSync("d1-clean.json", "utf8"));
            const count = archiveCompletedDays(snapshots, "data/history");
            console.log(`Archived ${count} daily snapshot files.`);
          '

      - name: Commit Daily Archival Data
        id: commit_step
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): archive raw telemetry history (zstd) [skip ci]'
          file_pattern: 'data/history/*/*.json.zst'

      - name: Prune D1 Database Records Older Than 90 Days
        if: steps.commit_step.conclusion == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler d1 execute transit-d1 --remote --config=worker/wrangler.toml --command="DELETE FROM train_locations WHERE timestamp < strftime('%s', 'now', '-90 days');"
